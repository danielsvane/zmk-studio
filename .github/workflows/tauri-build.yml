name: "tauri-build"

on:
  workflow_dispatch:
  push:
  release:
    types: [published]

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            name: macos
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-24.04"
            name: linux
            args: ""
          - platform: "ubuntu-24.04-arm"
            name: linux-arm64
            args: ""
          - platform: "windows-latest"
            name: windows
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      # This fork has no Azure Trusted Signing credentials, so the Windows signing
      # steps stay off and the .msi/.exe ship unsigned. Adding the AZURE_* secrets
      # turns the whole signing path back on with no workflow change. `secrets` is
      # not available in a step `if`, hence the hop through a job-level env var.
      AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zmk-studio

      # package.json takes the ts-client as `file:../zmk-studio-ts-client`, so it has
      # to sit next to the checkout — hence both repos land in subdirectories. npm
      # only symlinks that path, so the ts-client is built explicitly further down.
      - uses: actions/checkout@v4
        with:
          repository: danielsvane/zmk-studio-ts-client
          ref: customkeyboards
          submodules: recursive
          path: zmk-studio-ts-client

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libudev-dev patchelf \
            protobuf-compiler \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      # protoc regenerates the ts-client's protobuf sources, which aren't committed.
      - name: install protoc (macos only)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: install protoc (windows only)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc -y

      - name: Get release
        id: get_release
        if: github.event_name == 'release'
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: install dependencies (windows only)
        if: matrix.platform == 'windows-latest' && env.AZURE_SIGNING != ''
        working-directory: zmk-studio # signCommand resolves the dlib relative to src-tauri.
        run: |
          nuget.exe install Microsoft.Trusted.Signing.Client -Version 1.0.53 -x

      - name: Set up Windows Kit into PATH (windows only)
        if: matrix.platform == 'windows-latest' && env.AZURE_SIGNING != ''
        run: |
          echo "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm" # Set this to npm, yarn or pnpm.
          cache-dependency-path: |
            zmk-studio/package-lock.json
            zmk-studio-ts-client/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./zmk-studio/src-tauri -> target"

      # Its postinstall regenerates the protobuf sources and compiles lib/, which the
      # frontend's tsc step imports. Without this the build fails on unresolved
      # `@zmkfirmware/zmk-studio-ts-client/*` imports.
      - name: build ts-client
        working-directory: zmk-studio-ts-client
        run: npm install

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        working-directory: zmk-studio
        run: npm ci

      - name: drop the Windows signCommand (no signing credentials)
        if: matrix.platform == 'windows-latest' && env.AZURE_SIGNING == ''
        working-directory: zmk-studio/src-tauri
        shell: bash
        run: |
          node -e "const fs=require('fs'),f='tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));delete c.bundle.windows.signCommand;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - uses: azure/login@v2
        if: matrix.platform == 'windows-latest' && env.AZURE_SIGNING != ''
        with:
          enable-AzPSSession: true
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: tauri-apps/tauri-action@v0
        name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The APPLE_* vars are deliberately absent. A missing secret still defines
          # the variable as an empty string, and tauri treats set-but-empty as "sign
          # this", so it ran `security import` on an empty certificate and died with
          # SecKeychainItemImport. Unlike the Windows steps there is no `if` to hang
          # this on — an env key can't be conditionally omitted — so with no Apple
          # certificates to offer, the whole block goes. tauri.conf.json's
          # signingIdentity "-" then ad-hoc signs the bundle. Restore
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID together to sign and notarize.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: zmk-studio
          releaseId: ${{ steps.get_release.outputs.id }}
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: zmk-studio-${{ matrix.name }}
          path: |
            zmk-studio/src-tauri/target/release/bundle/**/*.deb
            zmk-studio/src-tauri/target/release/bundle/**/*.AppImage
            zmk-studio/src-tauri/target/*/release/bundle/**/*.dmg
            zmk-studio/src-tauri/target/*/release/bundle/**/*.app
            zmk-studio/src-tauri/target/release/bundle/**/*.msi
            zmk-studio/src-tauri/target/release/bundle/**/*.exe
  # A rolling `latest` release, so /download always offers the desktop build that
  # matches the deployed site. Doing it in one job rather than from the matrix keeps
  # the four platforms from racing each other to create the tag. It waits on every
  # platform: a partial set would leave dead links on the download page, so a single
  # platform failure keeps the previous release in place instead.
  publish-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/customkeyboards'
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish the rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the installers DownloadPage matches on — .app is a directory tree
          # that upload-artifact flattened and nothing consumes.
          mapfile -d '' assets < <(find artifacts -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*.exe' \) -print0)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no installers among the downloaded artifacts"
            exit 1
          fi
          printf 'publishing %s\n' "${assets[@]}"

          # Recreate rather than `upload --clobber`: after a version bump the old
          # installers would survive under their old names, and the download page
          # serves whichever asset matches its extension pattern first.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "$(node -p "require('./package.json').version") (${GITHUB_SHA::7})" \
            --notes "Desktop build of the \`customkeyboards\` branch, replaced on every push. Windows installers are unsigned." \
            "${assets[@]}"

  deploy-netlify:
    if: github.event_name == 'release'
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Netlify
        run: curl -X POST -d '{}' ${{ secrets.NETLIFY_DEPLOY_HOOK }}
